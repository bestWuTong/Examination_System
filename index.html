<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <title>考试系统</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #eef4ff;
      --text: #172033;
      --muted: #667085;
      --line: #d8dee9;
      --primary: #2563eb;
      --primary-strong: #1d4ed8;
      --success: #15803d;
      --success-soft: #e9f8ef;
      --danger: #b42318;
      --danger-soft: #fff0ed;
      --warning: #b54708;
      --shadow: 0 18px 50px rgba(23, 32, 51, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 30rem),
        linear-gradient(180deg, #f9fbff 0%, var(--bg) 46%, #edf3f8 100%);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .app {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .shell {
      display: grid;
      gap: 18px;
    }

    .top-title {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding: 4px 0 8px;
    }

    .top-title h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.2;
      font-weight: 750;
    }

    .top-title p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.8);
      color: var(--muted);
      white-space: nowrap;
    }

    .panel {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(216, 222, 233, 0.9);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .home-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }

    .home-head h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.35;
    }

    .bank-list {
      display: grid;
      gap: 10px;
      padding: 14px;
    }

    .bank-group {
      display: grid;
      gap: 8px;
    }

    .bank-group-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      min-height: 52px;
      padding: 13px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
      color: var(--text);
      text-align: left;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .bank-group-toggle:hover,
    .bank-group-toggle:focus-visible {
      border-color: rgba(37, 99, 235, 0.55);
      background: #eef4ff;
      outline: none;
    }

    .bank-group.expanded .bank-group-toggle {
      border-color: rgba(37, 99, 235, 0.9);
      background: #dbeafe;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.14);
    }

    .bank-group-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 17px;
      font-weight: 750;
      line-height: 1.35;
    }

    .bank-group-count {
      margin-left: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .bank-group.expanded .bank-group-count {
      color: var(--primary);
    }

    .bank-group-arrow {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      transition: transform 160ms ease;
    }

    .bank-group.expanded .bank-group-arrow {
      transform: rotate(90deg);
      color: var(--primary);
    }

    .bank-group-items {
      display: grid;
      gap: 8px;
      padding-left: 12px;
    }

    .bank-card {
      display: block;
      width: 100%;
      min-height: 52px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      text-align: left;
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .bank-card:hover,
    .bank-card:focus-visible {
      border-color: rgba(37, 99, 235, 0.55);
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.12);
      outline: none;
      transform: translateY(-1px);
    }

    .bank-name {
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.45;
    }

    .nav-btn,
    .primary-btn,
    .ghost-btn {
      min-height: 42px;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: 700;
      white-space: nowrap;
    }

    .nav-btn {
      background: var(--surface-soft);
      color: var(--primary);
      border: 1px solid #bfd2ff;
    }

    .nav-btn:hover:not(:disabled) {
      background: #e2ecff;
    }

    .primary-btn {
      background: var(--primary);
      color: #ffffff;
    }

    .primary-btn:hover:not(:disabled) {
      background: var(--primary-strong);
    }

    .ghost-btn {
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .question-panel {
      padding: 24px;
    }

    .question-meta {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-width: 0;
      margin-bottom: 14px;
    }

    .exam-name {
      min-width: 0;
      margin: 0;
      color: var(--muted);
      font-size: clamp(10px, 2.6vw, 14px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress {
      min-width: max-content;
      color: var(--muted);
      font-size: clamp(10px, 2.6vw, 14px);
      font-weight: 700;
      text-align: right;
      white-space: nowrap;
    }

    .question-title {
      margin: 0;
      font-size: 22px;
      line-height: 1.55;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .formatted-text {
      display: block;
      white-space: pre-wrap;
    }

    .formatted-code {
      margin: 12px 0;
      padding: 14px;
      overflow-x: auto;
      border-radius: 8px;
      background: #111827;
      color: #f8fafc;
      font-family: Consolas, "Courier New", monospace;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.55;
      white-space: pre;
    }

    .formatted-code code {
      font: inherit;
    }

    .options {
      display: grid;
      gap: 12px;
      margin-top: 22px;
    }

    .option {
      display: grid;
      grid-template-columns: 32px 1fr;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 58px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      text-align: left;
      transition: border-color 150ms ease, background 150ms ease, box-shadow 150ms ease;
    }

    .option:hover:not(:disabled),
    .option:focus-visible {
      border-color: rgba(37, 99, 235, 0.55);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.1);
      outline: none;
    }

    .option.selected {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .option.correct {
      border-color: rgba(21, 128, 61, 0.9);
      background: #d1fadf;
      color: #14532d;
    }

    .option.wrong {
      border-color: rgba(180, 35, 24, 0.88);
      background: #fee4e2;
      color: #7a271a;
    }

    .option-key {
      display: inline-grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #edf2f7;
      color: #344054;
      font-weight: 750;
    }

    .option.correct .option-key {
      background: var(--success);
      color: #ffffff;
    }

    .option.wrong .option-key {
      background: var(--danger);
      color: #ffffff;
    }

    .option-text {
      min-width: 0;
      overflow-wrap: anywhere;
      line-height: 1.45;
    }

    .multi-actions {
      display: flex;
      justify-content: flex-start;
      margin-top: 18px;
    }

    .fill-answer {
      display: grid;
      gap: 12px;
      margin-top: 22px;
    }

    .fill-input {
      width: 100%;
      min-height: 52px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .fill-input:focus {
      border-color: rgba(37, 99, 235, 0.65);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .fill-input:disabled {
      background: #f8fafc;
      color: var(--muted);
    }

    .fill-actions {
      display: flex;
      justify-content: flex-start;
    }

    .question-nav {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      min-width: 0;
    }

    .short-answer {
      margin-top: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }

    .short-answer summary {
      min-height: 52px;
      padding: 14px;
      cursor: pointer;
      color: var(--primary);
      font-weight: 750;
      line-height: 1.45;
    }

    .short-answer-content {
      padding: 16px 14px;
      border-top: 1px solid var(--line);
      line-height: 1.6;
    }

    .feedback {
      min-height: 44px;
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid transparent;
      line-height: 1.45;
      font-weight: 700;
    }

    .feedback.idle {
      display: none;
    }

    .feedback.ok {
      border-color: rgba(21, 128, 61, 0.28);
      background: var(--success-soft);
      color: var(--success);
    }

    .feedback.error {
      border-color: rgba(180, 35, 24, 0.24);
      background: var(--danger-soft);
      color: var(--danger);
    }

    .feedback.warn {
      border-color: rgba(181, 71, 8, 0.22);
      background: #fff7ed;
      color: var(--warning);
    }

    .result-panel {
      display: grid;
      justify-items: center;
      gap: 18px;
      padding: 42px 24px;
      text-align: center;
    }

    .score {
      margin: 0;
      font-size: 34px;
      line-height: 1.2;
      font-weight: 800;
    }

    .score-sub {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .loading,
    .empty {
      padding: 36px 20px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .hidden {
      display: none !important;
    }

    .import-btn {
      min-height: 42px;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: 700;
      white-space: nowrap;
      background: var(--success);
      color: #ffffff;
    }

    .import-btn:hover:not(:disabled) {
      background: var(--success-soft);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .export-btn {
      min-height: 42px;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: 700;
      white-space: nowrap;
      background: #7c3aed;
      color: #ffffff;
    }

    .export-btn:hover:not(:disabled) {
      background: #6d28d9;
    }

    .result-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    #importFileInput {
      display: none;
    }

    @media (max-width: 720px) {
      .app {
        width: min(100% - 20px, 1080px);
        padding: 18px 0 32px;
      }

      .top-title {
        display: grid;
      }

      .top-title h1 {
        font-size: 25px;
      }

      .home-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .bank-list {
        padding: 12px;
      }

      .progress {
        font-size: clamp(10px, 2.8vw, 13px);
      }

      .question-panel {
        padding: 18px;
      }

      .question-meta {
        gap: 8px;
      }

      .exam-name {
        font-size: clamp(10px, 2.8vw, 13px);
      }

      .question-title {
        font-size: 19px;
      }

      .option {
        grid-template-columns: 28px 1fr;
        min-height: 54px;
      }

      .option-key {
        width: 28px;
        height: 28px;
      }

      .multi-actions,
      .fill-actions {
        width: 100%;
      }

      .multi-actions .primary-btn,
      .fill-actions .primary-btn {
        width: 100%;
      }

      .question-nav {
        width: 100%;
      }

      .question-nav .nav-btn {
        flex: 1 1 0;
        min-width: 0;
        padding-right: 8px;
        padding-left: 8px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="homeView" class="shell">
      <div class="top-title">
        <div>
          <h1>考试系统</h1>
          <p>选择题库后开始答题。</p>
        </div>
        <span id="bankCount" class="badge">读取题库中</span>
      </div>

      <div class="panel">
        <div class="home-head">
          <h2>题库列表</h2>
          <div style="display: flex; gap: 8px;">
            <button id="importBtn" class="import-btn" type="button">导入错题集</button>
            <button id="reloadBtn" class="ghost-btn" type="button">刷新列表</button>
          </div>
        </div>
        <div id="bankList" class="bank-list">
          <div class="loading">正在读取 src/list.json</div>
        </div>
        <input id="importFileInput" type="file" accept=".txt">
      </div>
    </section>

    <section id="examView" class="hidden">
      <div class="panel question-panel">
        <div class="question-meta">
          <p id="examName" class="exam-name"></p>
          <div id="progressText" class="progress">第 0 题 / 共 0 题</div>
        </div>
        <div id="questionTitle" class="question-title" role="heading" aria-level="2"></div>
        <div id="options" class="options"></div>
        <div id="fillAnswer" class="fill-answer hidden">
          <input id="fillInput" class="fill-input" type="text" autocomplete="off" placeholder="请输入答案">
          <div class="fill-actions">
            <button id="submitFillBtn" class="primary-btn" type="button">提交答案</button>
          </div>
        </div>
        <div id="multiActions" class="multi-actions hidden">
          <button id="submitMultiBtn" class="primary-btn" type="button">提交答案</button>
        </div>
        <details id="shortAnswer" class="short-answer hidden">
          <summary>查看答案</summary>
          <div id="shortAnswerContent" class="short-answer-content"></div>
        </details>
        <div id="feedback" class="feedback idle"></div>
        <div class="question-nav">
          <button id="homeBtn" class="nav-btn" type="button">首页</button>
          <button id="prevBtn" class="nav-btn" type="button">上一题</button>
          <button id="nextBtn" class="nav-btn" type="button">下一题</button>
        </div>
      </div>
    </section>

    <section id="resultView" class="hidden">
      <div class="panel result-panel">
        <p id="scoreText" class="score">0 / 0</p>
        <p id="scoreSubText" class="score-sub"></p>
        <div class="result-actions">
          <button id="exportErrorBtn" class="export-btn" type="button">导出错题集</button>
          <button id="restartBtn" class="primary-btn" type="button">再做一次</button>
          <button id="resultHomeBtn" class="ghost-btn" type="button">回到首页</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const dom = {
      homeView: document.querySelector("#homeView"),
      examView: document.querySelector("#examView"),
      resultView: document.querySelector("#resultView"),
      bankCount: document.querySelector("#bankCount"),
      bankList: document.querySelector("#bankList"),
      reloadBtn: document.querySelector("#reloadBtn"),
      importBtn: document.querySelector("#importBtn"),
      importFileInput: document.querySelector("#importFileInput"),
      homeBtn: document.querySelector("#homeBtn"),
      prevBtn: document.querySelector("#prevBtn"),
      nextBtn: document.querySelector("#nextBtn"),
      progressText: document.querySelector("#progressText"),
      examName: document.querySelector("#examName"),
      questionTitle: document.querySelector("#questionTitle"),
      options: document.querySelector("#options"),
      fillAnswer: document.querySelector("#fillAnswer"),
      fillInput: document.querySelector("#fillInput"),
      submitFillBtn: document.querySelector("#submitFillBtn"),
      multiActions: document.querySelector("#multiActions"),
      submitMultiBtn: document.querySelector("#submitMultiBtn"),
      shortAnswer: document.querySelector("#shortAnswer"),
      shortAnswerContent: document.querySelector("#shortAnswerContent"),
      feedback: document.querySelector("#feedback"),
      scoreText: document.querySelector("#scoreText"),
      scoreSubText: document.querySelector("#scoreSubText"),
      exportErrorBtn: document.querySelector("#exportErrorBtn"),
      restartBtn: document.querySelector("#restartBtn"),
      resultHomeBtn: document.querySelector("#resultHomeBtn")
    };

    const state = {
      bankGroups: [],
      expandedGroupIndex: null,
      currentBank: null,
      questions: [],
      currentIndex: 0,
      selectedAnswers: new Map(),
      results: new Map(),
      autoTimer: null,
      isImportedExam: false,
      importedQuestions: []
    };

    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

    function showView(name) {
      dom.homeView.classList.toggle("hidden", name !== "home");
      dom.examView.classList.toggle("hidden", name !== "exam");
      dom.resultView.classList.toggle("hidden", name !== "result");
    }

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function normalizeAnswers(answer) {
      if (Array.isArray(answer)) {
        return answer.map((item) => String(item).trim()).filter(Boolean);
      }
      return [String(answer ?? "").trim()].filter(Boolean);
    }

    function normalizeQuestionType(type) {
      const value = String(type || "").trim();
      if (["单选", "多选", "判断", "填空", "简答"].includes(value)) {
        return value;
      }
      if (value === "选择") {
        return "单选";
      }
      return "单选";
    }

    function getQuestionType(question) {
      return normalizeQuestionType(question && question.type);
    }

    function isChoiceType(type) {
      return ["单选", "多选", "判断"].includes(normalizeQuestionType(type));
    }

    function isFillQuestion(question) {
      return getQuestionType(question) === "填空";
    }

    function isMultiQuestion(question) {
      return getQuestionType(question) === "多选";
    }

    function isShortAnswerQuestion(question) {
      return getQuestionType(question) === "简答";
    }

    function isGradableQuestion(question) {
      return !isShortAnswerQuestion(question);
    }

    function normalizeBank(item) {
      if (typeof item === "string") {
        return {
          file: item
        };
      }

      return {
        file: String(item.file || "")
      };
    }

    function normalizeBankGroup(item, index) {
      if (Array.isArray(item)) {
        return {
          name: `分组 ${index + 1}`,
          banks: item.map(normalizeBank).filter((bank) => bank.file)
        };
      }

      if (item && (Array.isArray(item.banks) || Array.isArray(item.items) || Array.isArray(item.questions))) {
        const banks = item.banks || item.items || item.questions;
        return {
          name: String(item.name || item.group || item.title || `分组 ${index + 1}`),
          banks: banks.map(normalizeBank).filter((bank) => bank.file)
        };
      }

      return {
        name: "默认分组",
        banks: [normalizeBank(item)].filter((bank) => bank.file)
      };
    }

    function normalizeBankGroups(list) {
      if (!Array.isArray(list)) {
        return [];
      }

      const groups = list.map(normalizeBankGroup).filter((group) => group.banks.length > 0);
      if (groups.length === 0) {
        return [];
      }

      const oldFlatList = list.every((item) => typeof item === "string" || (item && item.file));
      if (oldFlatList) {
        return [{
          name: "默认分组",
          banks: groups.flatMap((group) => group.banks)
        }];
      }

      return groups;
    }

    function getBankTotalCount() {
      return state.bankGroups.reduce((total, group) => total + group.banks.length, 0);
    }

    function sameAnswerSet(left, right) {
      if (left.length !== right.length) {
        return false;
      }
      const rightSet = new Set(right);
      return left.every((item) => rightSet.has(item));
    }

    function normalizeBankData(rawData, fallbackType = "") {
      if (Array.isArray(rawData)) {
        const firstQuestion = rawData[0] || {};
        const inferredType = firstQuestion.type
          || (Array.isArray(firstQuestion.options) && firstQuestion.options.length > 0
            ? (Array.isArray(firstQuestion.correct_answer) ? "多选" : "单选")
            : "填空");
        const type = normalizeQuestionType(fallbackType || inferredType);
        return { type, questions: rawData };
      }

      if (rawData && Array.isArray(rawData.questions)) {
        const type = normalizeQuestionType(rawData.type || fallbackType);
        return { type, questions: rawData.questions };
      }

      throw new Error("题库格式不正确");
    }

    function getOriginalQuestion(question) {
      if (!state.isImportedExam) {
        return question;
      }

      return state.importedQuestions.find((item) => item.id === question.id && item.content === question.content) || question;
    }

    function normalizeQuestion(question, type, index) {
      const questionType = normalizeQuestionType(question.type || type);
      const originalOptions = Array.isArray(question.options) ? question.options.map(String) : [];
      const options = questionType === "判断"
        ? ["正确", "错误"]
        : (isChoiceType(questionType) ? shuffle(originalOptions) : []);
      const correctAnswers = questionType === "判断"
        ? normalizeJudgementAnswers(question.correct_answer)
        : normalizeAnswers(question.correct_answer);

      return {
        ...question,
        type: questionType,
        uid: `${Date.now()}-${index}-${Math.random().toString(16).slice(2)}`,
        options,
        originalOptions,
        correctAnswers
      };
    }

    function normalizeJudgementAnswers(answer) {
      return normalizeAnswers(answer).map((item) => {
        const value = String(item).trim().toUpperCase();
        if (["A", "TRUE", "T", "对", "是"].includes(value)) {
          return "正确";
        }
        if (["B", "FALSE", "F", "错", "否"].includes(value)) {
          return "错误";
        }
        return item;
      });
    }

    function clearAutoTimer() {
      if (state.autoTimer) {
        window.clearTimeout(state.autoTimer);
        state.autoTimer = null;
      }
    }

    async function fetchJson(path) {
      const response = await fetch(path, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`读取失败：${response.status}`);
      }
      const text = await response.text();
      return parseJsonText(text);
    }

    function parseJsonText(text) {
      try {
        return JSON.parse(text);
      } catch (error) {
        return JSON.parse(escapeControlCharactersInStrings(text));
      }
    }

    function escapeControlCharactersInStrings(text) {
      let result = "";
      let inString = false;
      let escaped = false;

      for (let index = 0; index < text.length; index += 1) {
        const char = text[index];

        if (!inString) {
          result += char;
          if (char === '"') {
            inString = true;
          }
          continue;
        }

        if (escaped) {
          result += char;
          escaped = false;
          continue;
        }

        if (char === "\\") {
          result += char;
          escaped = true;
        } else if (char === '"') {
          result += char;
          inString = false;
        } else if (char === "\r") {
          result += "\\n";
          if (text[index + 1] === "\n") {
            index += 1;
          }
        } else if (char === "\n") {
          result += "\\n";
        } else if (char === "\t") {
          result += "\\t";
        } else {
          result += char;
        }
      }

      return result;
    }

    function setBankCount(text) {
      dom.bankCount.textContent = text;
    }

    async function loadBanks() {
      showView("home");
      setBankCount("读取题库中");
      dom.bankList.innerHTML = '<div class="loading">正在读取 src/list.json</div>';

      try {
        const list = await fetchJson("src/list.json");
        state.bankGroups = normalizeBankGroups(list);
        state.expandedGroupIndex = null;
        renderBankList();
      } catch (error) {
        setBankCount("读取失败");
        dom.bankList.innerHTML = `<div class="empty">${escapeHtml(error.message)}。请通过本地 HTTP 服务打开本页面。</div>`;
      }
    }

    function renderBankList() {
      const bankCount = getBankTotalCount();
      setBankCount(`${bankCount} 个题库`);

      if (bankCount === 0) {
        dom.bankList.innerHTML = '<div class="empty">src/list.json 中没有题库。</div>';
        return;
      }

      dom.bankList.innerHTML = "";
      state.bankGroups.forEach((group, groupIndex) => {
        const expanded = state.expandedGroupIndex === groupIndex;
        const groupElement = document.createElement("div");
        groupElement.className = `bank-group${expanded ? " expanded" : ""}`;

        const toggle = document.createElement("button");
        toggle.className = "bank-group-toggle";
        toggle.type = "button";
        toggle.setAttribute("aria-expanded", String(expanded));
        toggle.innerHTML = `
          <span class="bank-group-name">${escapeHtml(group.name)}<span class="bank-group-count">${group.banks.length} 个</span></span>
          <span class="bank-group-arrow" aria-hidden="true">›</span>
        `;
        toggle.addEventListener("click", () => {
          state.expandedGroupIndex = expanded ? null : groupIndex;
          renderBankList();
        });
        groupElement.appendChild(toggle);

        if (expanded) {
          const groupItems = document.createElement("div");
          groupItems.className = "bank-group-items";
          group.banks.forEach((bank) => {
            const button = document.createElement("button");
            button.className = "bank-card";
            button.type = "button";
            button.innerHTML = `<span class="bank-name">${escapeHtml(getBankDisplayName(bank.file))}</span>`;
            button.addEventListener("click", () => startExam(bank));
            groupItems.appendChild(button);
          });
          groupElement.appendChild(groupItems);
        }

        dom.bankList.appendChild(groupElement);
      });
    }

    async function startExam(bank) {
      clearAutoTimer();
      state.isImportedExam = false;
      state.importedQuestions = [];
      dom.bankList.innerHTML = '<div class="loading">正在载入题目</div>';

      try {
        const bankData = normalizeBankData(await fetchJson(`src/${encodeURIComponent(bank.file)}`));
        if (bankData.questions.length === 0) {
          throw new Error("题库中没有题目");
        }

        state.currentBank = { ...bank, type: bankData.type };
        state.questions = shuffle(bankData.questions).map((question, index) => normalizeQuestion(question, bankData.type, index));
        state.currentIndex = 0;
        state.selectedAnswers = new Map();
        state.results = new Map();

        showView("exam");
        renderQuestion();
      } catch (error) {
        renderBankList();
        setFeedback(`题库加载失败：${error.message}`, "error");
        dom.bankList.prepend(Object.assign(document.createElement("div"), {
          className: "empty",
          textContent: `题库加载失败：${error.message}`
        }));
      }
    }

    function renderQuestion() {
      clearAutoTimer();
      const question = state.questions[state.currentIndex];
      if (!question) {
        finishExam();
        return;
      }

      const selected = state.selectedAnswers.get(question.uid) || [];
      const result = state.results.get(question.uid);
      const type = getQuestionType(question);
      const fill = isFillQuestion(question);
      const multi = isMultiQuestion(question);
      const shortAnswer = isShortAnswerQuestion(question);
      const choice = isChoiceType(type);

      dom.examName.textContent = getBankDisplayName(state.currentBank.file);
      dom.progressText.textContent = `第 ${state.currentIndex + 1} 题 / 共 ${state.questions.length} 题`;
      dom.prevBtn.disabled = state.currentIndex === 0;
      dom.nextBtn.textContent = state.currentIndex === state.questions.length - 1 ? "交卷" : "下一题";
      renderFormattedText(dom.questionTitle, question.content || "未命名题目");
      dom.options.classList.toggle("hidden", !choice);
      dom.fillAnswer.classList.toggle("hidden", !fill);
      dom.multiActions.classList.toggle("hidden", fill || !multi || Boolean(result));
      dom.shortAnswer.classList.toggle("hidden", !shortAnswer);
      dom.shortAnswer.open = false;
      dom.submitMultiBtn.disabled = selected.length === 0;
      setFeedback("", "idle");
      dom.options.innerHTML = "";
      dom.fillInput.value = selected[0] || "";
      dom.fillInput.disabled = Boolean(result);
      dom.submitFillBtn.disabled = Boolean(result);
      dom.shortAnswerContent.replaceChildren();

      if (shortAnswer) {
        renderFormattedText(dom.shortAnswerContent, question.correctAnswers.join("、") || "暂无答案");
        return;
      }

      if (fill) {
        if (result) {
          showStoredResult(result);
        } else {
          dom.fillInput.focus();
        }
        return;
      }

      question.options.forEach((option, optionIndex) => {
        const optionButton = document.createElement("button");
        optionButton.type = "button";
        optionButton.className = getOptionClass(option, selected, question.correctAnswers, result);
        optionButton.disabled = Boolean(result);
        optionButton.innerHTML = `
          <span class="option-key">${letters[optionIndex] || optionIndex + 1}</span>
          <span class="option-text"></span>
        `;
        renderFormattedText(optionButton.querySelector(".option-text"), option);
        optionButton.addEventListener("click", () => {
          if (multi) {
            toggleMultiAnswer(question.uid, option);
          } else {
            submitAnswer([option]);
          }
        });
        dom.options.appendChild(optionButton);
      });

      if (result) {
        showStoredResult(result);
      }
    }

    function getOptionClass(option, selected, correctAnswers, result) {
      const classes = ["option"];
      if (selected.includes(option)) {
        classes.push("selected");
      }

      if (result) {
        if (correctAnswers.includes(option)) {
          classes.push("correct");
        } else if (selected.includes(option)) {
          classes.push("wrong");
        }
      }

      return classes.join(" ");
    }

    function toggleMultiAnswer(questionUid, option) {
      const current = state.selectedAnswers.get(questionUid) || [];
      const next = current.includes(option)
        ? current.filter((item) => item !== option)
        : [...current, option];
      state.selectedAnswers.set(questionUid, next);
      renderQuestion();
    }

    function submitAnswer(answer) {
      const question = state.questions[state.currentIndex];
      if (!question || state.results.has(question.uid) || isShortAnswerQuestion(question)) {
        return;
      }

      const selected = answer.map(String);
      const correct = isFillQuestion(question)
        ? selected[0] === question.correctAnswers[0]
        : sameAnswerSet(selected, question.correctAnswers);
      const result = {
        selected,
        correct,
        correctAnswers: question.correctAnswers
      };

      state.selectedAnswers.set(question.uid, selected);
      state.results.set(question.uid, result);
      renderQuestion();

      if (correct && !isFillQuestion(question)) {
        state.autoTimer = window.setTimeout(() => {
          goNext();
        }, 700);
      }
    }

    function submitMultiAnswer() {
      const question = state.questions[state.currentIndex];
      const selected = state.selectedAnswers.get(question.uid) || [];
      if (selected.length === 0) {
        setFeedback("请选择答案后再提交。", "warn");
        return;
      }
      submitAnswer(selected);
    }

    function submitFillAnswer() {
      const value = dom.fillInput.value;
      if (value === "") {
        setFeedback("请输入答案后再提交。", "warn");
        return;
      }
      submitAnswer([value]);
    }

    function handleExamEnter(event) {
      if (event.key !== "Enter" || dom.examView.classList.contains("hidden")) {
        return;
      }

      const question = state.questions[state.currentIndex];
      if (!question) {
        return;
      }

      event.preventDefault();

      if (isShortAnswerQuestion(question)) {
        if (dom.shortAnswer.open) {
          goNext();
        } else {
          dom.shortAnswer.open = true;
        }
        return;
      }

      const result = state.results.get(question.uid);
      if (result) {
        if (!result.correct) {
          goNext();
        }
        return;
      }

      if (isFillQuestion(question)) {
        submitFillAnswer();
        return;
      }

      if (isMultiQuestion(question)) {
        submitMultiAnswer();
      }
    }

    function showStoredResult(result) {
      if (result.correct) {
        setFeedback("回答正确", "ok");
        return;
      }

      setFeedback(`回答错误。正确答案：${result.correctAnswers.join("、")}`, "error");
    }

    function setFeedback(text, type) {
      dom.feedback.textContent = text;
      dom.feedback.className = `feedback ${type}`;
    }

    function goPrev() {
      clearAutoTimer();
      if (state.currentIndex > 0) {
        state.currentIndex -= 1;
        renderQuestion();
      }
    }

    function goNext() {
      clearAutoTimer();
      if (state.currentIndex < state.questions.length - 1) {
        state.currentIndex += 1;
        renderQuestion();
      } else {
        finishExam();
      }
    }

    function finishExam() {
      clearAutoTimer();
      const gradableQuestions = state.questions.filter(isGradableQuestion);
      const correctCount = gradableQuestions.reduce((total, question) => {
        const result = state.results.get(question.uid);
        return total + (result && result.correct ? 1 : 0);
      }, 0);
      const total = gradableQuestions.length;
      const shortAnswerCount = state.questions.length - total;

      dom.scoreText.textContent = `${correctCount} / ${total}`;
      dom.scoreSubText.textContent = shortAnswerCount > 0
        ? `做对了 ${correctCount} 道，共 ${total} 道；${shortAnswerCount} 道简答题不计分`
        : `做对了 ${correctCount} 道，共 ${total} 道`;
      showView("result");
    }

    function restartExam() {
      if (state.isImportedExam && state.importedQuestions.length > 0) {
        startImportedExam(state.importedQuestions);
      } else if (state.currentBank) {
        startExam(state.currentBank);
      } else {
        loadBanks();
      }
    }

    function goHome() {
      clearAutoTimer();
      state.isImportedExam = false;
      state.importedQuestions = [];
      showView("home");
      renderBankList();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderFormattedText(target, value) {
      const source = String(value);
      const fragment = document.createDocumentFragment();
      const codeBlockPattern = /```[^\n]*\n?([\s\S]*?)```/g;
      let lastIndex = 0;
      let match;

      while ((match = codeBlockPattern.exec(source)) !== null) {
        appendTextBlock(fragment, source.slice(lastIndex, match.index));
        const pre = document.createElement("pre");
        const code = document.createElement("code");
        pre.className = "formatted-code";
        code.textContent = match[1].replace(/\n$/, "");
        pre.appendChild(code);
        fragment.appendChild(pre);
        lastIndex = codeBlockPattern.lastIndex;
      }

      appendTextBlock(fragment, source.slice(lastIndex));
      target.replaceChildren(fragment);
    }

    function appendTextBlock(fragment, text) {
      if (!text) {
        return;
      }

      const span = document.createElement("span");
      span.className = "formatted-text";
      span.textContent = text;
      fragment.appendChild(span);
    }

    function getBankDisplayName(fileName) {
      return String(fileName).replace(/\.txt$/i, "");
    }

    function formatDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const seconds = String(date.getSeconds()).padStart(2, '0');
      return `${year}年${month}月${day}日${hours}时${minutes}分${seconds}秒`;
    }

    function exportErrorQuestions() {
      const errorQuestions = [];
      state.questions.forEach((question) => {
        const result = state.results.get(question.uid);
        if (isGradableQuestion(question) && result && !result.correct) {
          const originalQuestion = getOriginalQuestion(question);
          const questionData = {
            id: question.id,
            type: getQuestionType(question),
            content: question.content,
            correct_answer: question.correctAnswers.length === 1 ? question.correctAnswers[0] : question.correctAnswers
          };
          if (originalQuestion && Array.isArray(originalQuestion.options) && originalQuestion.options.length > 0) {
            questionData.options = originalQuestion.options.map(String);
          }
          errorQuestions.push(questionData);
        }
      });

      if (errorQuestions.length === 0) {
        alert('没有错题可以导出！');
        return;
      }

      const content = JSON.stringify({
        type: normalizeQuestionType(state.currentBank && state.currentBank.type),
        questions: errorQuestions
      }, null, 4);
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      const now = new Date();
      link.href = url;
      link.download = `错题集-${formatDate(now)}.txt`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function importErrorQuestions() {
      dom.importFileInput.click();
    }

    function handleFileImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const content = e.target.result;
          const importedData = normalizeBankData(parseJsonText(content));

          if (importedData.questions.length === 0) {
            alert('导入的错题集为空或格式不正确！');
            return;
          }

          const isValid = importedData.questions.every(q => q.id && q.content && q.correct_answer);
          if (!isValid) {
            alert('错题集格式不正确，缺少必要的题目信息！');
            return;
          }

          startImportedExam(importedData);
        } catch (error) {
          alert('解析错题集文件失败：' + error.message);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    async function startImportedExam(importedData) {
      clearAutoTimer();
      const bankData = normalizeBankData(importedData);
      state.isImportedExam = true;
      state.importedQuestions = bankData.questions;
      state.currentBank = { file: '导入的错题集', type: bankData.type };

      state.questions = shuffle(bankData.questions).map((question, index) => normalizeQuestion(question, bankData.type, index));

      state.currentIndex = 0;
      state.selectedAnswers = new Map();
      state.results = new Map();

      showView('exam');
      renderQuestion();
    }

    dom.reloadBtn.addEventListener("click", loadBanks);
    dom.importBtn.addEventListener("click", importErrorQuestions);
    dom.importFileInput.addEventListener("change", handleFileImport);
    dom.homeBtn.addEventListener("click", goHome);
    dom.prevBtn.addEventListener("click", goPrev);
    dom.nextBtn.addEventListener("click", goNext);
    dom.submitMultiBtn.addEventListener("click", submitMultiAnswer);
    dom.submitFillBtn.addEventListener("click", submitFillAnswer);
    document.addEventListener("keydown", handleExamEnter);
    dom.exportErrorBtn.addEventListener("click", exportErrorQuestions);
    dom.restartBtn.addEventListener("click", restartExam);
    dom.resultHomeBtn.addEventListener("click", goHome);

    loadBanks();
  </script>
</body>
</html>
