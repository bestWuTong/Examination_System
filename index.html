<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>考试系统</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #eef4ff;
      --text: #172033;
      --muted: #667085;
      --line: #d8dee9;
      --primary: #2563eb;
      --primary-strong: #1d4ed8;
      --success: #15803d;
      --success-soft: #e9f8ef;
      --danger: #b42318;
      --danger-soft: #fff0ed;
      --warning: #b54708;
      --shadow: 0 18px 50px rgba(23, 32, 51, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 30rem),
        linear-gradient(180deg, #f9fbff 0%, var(--bg) 46%, #edf3f8 100%);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .app {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .shell {
      display: grid;
      gap: 18px;
    }

    .top-title {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding: 4px 0 8px;
    }

    .top-title h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.2;
      font-weight: 750;
    }

    .top-title p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.8);
      color: var(--muted);
      white-space: nowrap;
    }

    .panel {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(216, 222, 233, 0.9);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .home-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }

    .home-head h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.35;
    }

    .bank-list {
      display: grid;
      gap: 10px;
      padding: 14px;
    }

    .bank-card {
      display: block;
      width: 100%;
      min-height: 52px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      text-align: left;
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .bank-card:hover,
    .bank-card:focus-visible {
      border-color: rgba(37, 99, 235, 0.55);
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.12);
      outline: none;
      transform: translateY(-1px);
    }

    .bank-name {
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.45;
    }

    .exam-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(82px, auto) minmax(82px, auto) 1fr minmax(82px, auto);
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 12px 36px rgba(23, 32, 51, 0.08);
      backdrop-filter: blur(12px);
    }

    .nav-btn,
    .primary-btn,
    .ghost-btn {
      min-height: 42px;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: 700;
      white-space: nowrap;
    }

    .nav-btn {
      background: var(--surface-soft);
      color: var(--primary);
      border: 1px solid #bfd2ff;
    }

    .nav-btn:hover:not(:disabled) {
      background: #e2ecff;
    }

    .primary-btn {
      background: var(--primary);
      color: #ffffff;
    }

    .primary-btn:hover:not(:disabled) {
      background: var(--primary-strong);
    }

    .ghost-btn {
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .progress {
      display: flex;
      justify-content: center;
      min-width: 0;
      color: var(--muted);
      font-weight: 700;
      text-align: center;
    }

    .question-panel {
      margin-top: 16px;
      padding: 24px;
    }

    .exam-name {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .question-type {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      margin-bottom: 14px;
      padding: 4px 9px;
      border-radius: 999px;
      background: #fef3c7;
      color: #92400e;
      font-size: 13px;
      font-weight: 700;
    }

    .question-title {
      margin: 0;
      font-size: 22px;
      line-height: 1.55;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .formatted-text {
      display: block;
      white-space: pre-wrap;
    }

    .formatted-code {
      margin: 12px 0;
      padding: 14px;
      overflow-x: auto;
      border-radius: 8px;
      background: #111827;
      color: #f8fafc;
      font-family: Consolas, "Courier New", monospace;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.55;
      white-space: pre;
    }

    .formatted-code code {
      font: inherit;
    }

    .options {
      display: grid;
      gap: 12px;
      margin-top: 22px;
    }

    .option {
      display: grid;
      grid-template-columns: 32px 1fr;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 58px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      text-align: left;
      transition: border-color 150ms ease, background 150ms ease, box-shadow 150ms ease;
    }

    .option:hover:not(:disabled),
    .option:focus-visible {
      border-color: rgba(37, 99, 235, 0.55);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.1);
      outline: none;
    }

    .option.selected {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .option.correct {
      border-color: rgba(21, 128, 61, 0.65);
      background: var(--success-soft);
    }

    .option.wrong {
      border-color: rgba(180, 35, 24, 0.6);
      background: var(--danger-soft);
    }

    .option-key {
      display: inline-grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #edf2f7;
      color: #344054;
      font-weight: 750;
    }

    .option-text {
      min-width: 0;
      overflow-wrap: anywhere;
      line-height: 1.45;
    }

    .multi-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .fill-answer {
      display: grid;
      gap: 12px;
      margin-top: 22px;
    }

    .fill-input {
      width: 100%;
      min-height: 52px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .fill-input:focus {
      border-color: rgba(37, 99, 235, 0.65);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .fill-input:disabled {
      background: #f8fafc;
      color: var(--muted);
    }

    .fill-actions {
      display: flex;
      justify-content: flex-end;
    }

    .feedback {
      min-height: 44px;
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid transparent;
      line-height: 1.45;
      font-weight: 700;
    }

    .feedback.idle {
      display: none;
    }

    .feedback.ok {
      border-color: rgba(21, 128, 61, 0.28);
      background: var(--success-soft);
      color: var(--success);
    }

    .feedback.error {
      border-color: rgba(180, 35, 24, 0.24);
      background: var(--danger-soft);
      color: var(--danger);
    }

    .feedback.warn {
      border-color: rgba(181, 71, 8, 0.22);
      background: #fff7ed;
      color: var(--warning);
    }

    .result-panel {
      display: grid;
      justify-items: center;
      gap: 18px;
      padding: 42px 24px;
      text-align: center;
    }

    .score {
      margin: 0;
      font-size: 34px;
      line-height: 1.2;
      font-weight: 800;
    }

    .score-sub {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .loading,
    .empty {
      padding: 36px 20px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 720px) {
      .app {
        width: min(100% - 20px, 1080px);
        padding: 18px 0 32px;
      }

      .top-title {
        display: grid;
      }

      .top-title h1 {
        font-size: 25px;
      }

      .home-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .bank-list {
        padding: 12px;
      }

      .exam-bar {
        grid-template-columns: 1fr 1fr;
      }

      .progress {
        grid-column: 1 / -1;
        grid-row: 1;
        justify-content: center;
        min-height: 32px;
      }

      .question-panel {
        padding: 18px;
      }

      .question-title {
        font-size: 19px;
      }

      .option {
        grid-template-columns: 28px 1fr;
        min-height: 54px;
      }

      .option-key {
        width: 28px;
        height: 28px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="homeView" class="shell">
      <div class="top-title">
        <div>
          <h1>考试系统</h1>
          <p>选择题库后开始答题。</p>
        </div>
        <span id="bankCount" class="badge">读取题库中</span>
      </div>

      <div class="panel">
        <div class="home-head">
          <h2>题库列表</h2>
          <button id="reloadBtn" class="ghost-btn" type="button">刷新列表</button>
        </div>
        <div id="bankList" class="bank-list">
          <div class="loading">正在读取 src/list.json</div>
        </div>
      </div>
    </section>

    <section id="examView" class="hidden">
      <div class="exam-bar">
        <button id="homeBtn" class="nav-btn" type="button">首页</button>
        <button id="prevBtn" class="nav-btn" type="button">上一题</button>
        <div id="progressText" class="progress">第 0 题 / 共 0 题</div>
        <button id="nextBtn" class="nav-btn" type="button">下一题</button>
      </div>

      <div class="panel question-panel">
        <p id="examName" class="exam-name"></p>
        <span id="questionType" class="question-type">单选题</span>
        <div id="questionTitle" class="question-title" role="heading" aria-level="2"></div>
        <div id="options" class="options"></div>
        <div id="fillAnswer" class="fill-answer hidden">
          <input id="fillInput" class="fill-input" type="text" autocomplete="off" placeholder="请输入答案">
          <div class="fill-actions">
            <button id="submitFillBtn" class="primary-btn" type="button">提交答案</button>
          </div>
        </div>
        <div id="multiActions" class="multi-actions hidden">
          <button id="submitMultiBtn" class="primary-btn" type="button">提交答案</button>
        </div>
        <div id="feedback" class="feedback idle"></div>
      </div>
    </section>

    <section id="resultView" class="hidden">
      <div class="panel result-panel">
        <p id="scoreText" class="score">0 / 0</p>
        <p id="scoreSubText" class="score-sub"></p>
        <div>
          <button id="restartBtn" class="primary-btn" type="button">再做一次</button>
          <button id="resultHomeBtn" class="ghost-btn" type="button">回到首页</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const dom = {
      homeView: document.querySelector("#homeView"),
      examView: document.querySelector("#examView"),
      resultView: document.querySelector("#resultView"),
      bankCount: document.querySelector("#bankCount"),
      bankList: document.querySelector("#bankList"),
      reloadBtn: document.querySelector("#reloadBtn"),
      homeBtn: document.querySelector("#homeBtn"),
      prevBtn: document.querySelector("#prevBtn"),
      nextBtn: document.querySelector("#nextBtn"),
      progressText: document.querySelector("#progressText"),
      examName: document.querySelector("#examName"),
      questionType: document.querySelector("#questionType"),
      questionTitle: document.querySelector("#questionTitle"),
      options: document.querySelector("#options"),
      fillAnswer: document.querySelector("#fillAnswer"),
      fillInput: document.querySelector("#fillInput"),
      submitFillBtn: document.querySelector("#submitFillBtn"),
      multiActions: document.querySelector("#multiActions"),
      submitMultiBtn: document.querySelector("#submitMultiBtn"),
      feedback: document.querySelector("#feedback"),
      scoreText: document.querySelector("#scoreText"),
      scoreSubText: document.querySelector("#scoreSubText"),
      restartBtn: document.querySelector("#restartBtn"),
      resultHomeBtn: document.querySelector("#resultHomeBtn")
    };

    const state = {
      banks: [],
      currentBank: null,
      questions: [],
      currentIndex: 0,
      selectedAnswers: new Map(),
      results: new Map(),
      autoTimer: null
    };

    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

    function showView(name) {
      dom.homeView.classList.toggle("hidden", name !== "home");
      dom.examView.classList.toggle("hidden", name !== "exam");
      dom.resultView.classList.toggle("hidden", name !== "result");
    }

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function normalizeAnswers(answer) {
      if (Array.isArray(answer)) {
        return answer.map(String);
      }
      return [String(answer)];
    }

    function normalizeBank(item) {
      if (typeof item === "string") {
        return {
          file: item,
          type: "选择"
        };
      }

      return {
        file: String(item.file || ""),
        type: String(item.type || "选择")
      };
    }

    function isFillExam() {
      return state.currentBank && state.currentBank.type === "填空";
    }

    function isMultiQuestion(question) {
      return Array.isArray(question.correct_answer);
    }

    function sameAnswerSet(left, right) {
      if (left.length !== right.length) {
        return false;
      }
      const rightSet = new Set(right);
      return left.every((item) => rightSet.has(item));
    }

    function clearAutoTimer() {
      if (state.autoTimer) {
        window.clearTimeout(state.autoTimer);
        state.autoTimer = null;
      }
    }

    async function fetchJson(path) {
      const response = await fetch(path, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`读取失败：${response.status}`);
      }
      const text = await response.text();
      return parseJsonText(text);
    }

    function parseJsonText(text) {
      try {
        return JSON.parse(text);
      } catch (error) {
        return JSON.parse(escapeControlCharactersInStrings(text));
      }
    }

    function escapeControlCharactersInStrings(text) {
      let result = "";
      let inString = false;
      let escaped = false;

      for (let index = 0; index < text.length; index += 1) {
        const char = text[index];

        if (!inString) {
          result += char;
          if (char === '"') {
            inString = true;
          }
          continue;
        }

        if (escaped) {
          result += char;
          escaped = false;
          continue;
        }

        if (char === "\\") {
          result += char;
          escaped = true;
        } else if (char === '"') {
          result += char;
          inString = false;
        } else if (char === "\r") {
          result += "\\n";
          if (text[index + 1] === "\n") {
            index += 1;
          }
        } else if (char === "\n") {
          result += "\\n";
        } else if (char === "\t") {
          result += "\\t";
        } else {
          result += char;
        }
      }

      return result;
    }

    function setBankCount(text) {
      dom.bankCount.textContent = text;
    }

    async function loadBanks() {
      showView("home");
      setBankCount("读取题库中");
      dom.bankList.innerHTML = '<div class="loading">正在读取 src/list.json</div>';

      try {
        const list = await fetchJson("src/list.json");
        state.banks = Array.isArray(list)
          ? list.map(normalizeBank).filter((bank) => bank.file)
          : [];
        renderBankList();
      } catch (error) {
        setBankCount("读取失败");
        dom.bankList.innerHTML = `<div class="empty">${escapeHtml(error.message)}。请通过本地 HTTP 服务打开本页面。</div>`;
      }
    }

    function renderBankList() {
      setBankCount(`${state.banks.length} 个题库`);

      if (state.banks.length === 0) {
        dom.bankList.innerHTML = '<div class="empty">src/list.json 中没有题库。</div>';
        return;
      }

      dom.bankList.innerHTML = "";
      state.banks.forEach((bank) => {
        const button = document.createElement("button");
        button.className = "bank-card";
        button.type = "button";
        button.innerHTML = `<span class="bank-name">${escapeHtml(getBankDisplayName(bank.file))}</span>`;
        button.addEventListener("click", () => startExam(bank));
        dom.bankList.appendChild(button);
      });
    }

    async function startExam(bank) {
      clearAutoTimer();
      dom.bankList.innerHTML = '<div class="loading">正在载入题目</div>';

      try {
        const rawQuestions = await fetchJson(`src/${encodeURIComponent(bank.file)}`);
        if (!Array.isArray(rawQuestions) || rawQuestions.length === 0) {
          throw new Error("题库中没有题目");
        }

        state.currentBank = bank;
        state.questions = shuffle(rawQuestions).map((question, index) => ({
          ...question,
          uid: `${Date.now()}-${index}-${Math.random().toString(16).slice(2)}`,
          options: bank.type === "选择"
            ? shuffle(Array.isArray(question.options) ? question.options.map(String) : [])
            : [],
          correctAnswers: normalizeAnswers(question.correct_answer)
        }));
        state.currentIndex = 0;
        state.selectedAnswers = new Map();
        state.results = new Map();

        showView("exam");
        renderQuestion();
      } catch (error) {
        renderBankList();
        setFeedback(`题库加载失败：${error.message}`, "error");
        dom.bankList.prepend(Object.assign(document.createElement("div"), {
          className: "empty",
          textContent: `题库加载失败：${error.message}`
        }));
      }
    }

    function renderQuestion() {
      clearAutoTimer();
      const question = state.questions[state.currentIndex];
      if (!question) {
        finishExam();
        return;
      }

      const selected = state.selectedAnswers.get(question.uid) || [];
      const result = state.results.get(question.uid);
      const fill = isFillExam();
      const multi = !fill && isMultiQuestion(question);

      dom.examName.textContent = getBankDisplayName(state.currentBank.file);
      dom.progressText.textContent = `第 ${state.currentIndex + 1} 题 / 共 ${state.questions.length} 题`;
      dom.prevBtn.disabled = state.currentIndex === 0;
      dom.nextBtn.textContent = state.currentIndex === state.questions.length - 1 ? "交卷" : "下一题";
      dom.questionType.textContent = fill ? "填空题" : (multi ? "多选题" : "单选题");
      renderFormattedText(dom.questionTitle, question.content || "未命名题目");
      dom.options.classList.toggle("hidden", fill);
      dom.fillAnswer.classList.toggle("hidden", !fill);
      dom.multiActions.classList.toggle("hidden", fill || !multi || Boolean(result));
      dom.submitMultiBtn.disabled = selected.length === 0;
      setFeedback("", "idle");
      dom.options.innerHTML = "";
      dom.fillInput.value = selected[0] || "";
      dom.fillInput.disabled = Boolean(result);
      dom.submitFillBtn.disabled = Boolean(result);

      if (fill) {
        if (result) {
          showStoredResult(result);
        } else {
          dom.fillInput.focus();
        }
        return;
      }

      question.options.forEach((option, optionIndex) => {
        const optionButton = document.createElement("button");
        optionButton.type = "button";
        optionButton.className = getOptionClass(option, selected, question.correctAnswers, result);
        optionButton.disabled = Boolean(result);
        optionButton.innerHTML = `
          <span class="option-key">${letters[optionIndex] || optionIndex + 1}</span>
          <span class="option-text"></span>
        `;
        renderFormattedText(optionButton.querySelector(".option-text"), option);
        optionButton.addEventListener("click", () => {
          if (multi) {
            toggleMultiAnswer(question.uid, option);
          } else {
            submitAnswer([option]);
          }
        });
        dom.options.appendChild(optionButton);
      });

      if (result) {
        showStoredResult(result);
      }
    }

    function getOptionClass(option, selected, correctAnswers, result) {
      const classes = ["option"];
      if (selected.includes(option)) {
        classes.push("selected");
      }

      if (result) {
        if (correctAnswers.includes(option)) {
          classes.push("correct");
        } else if (selected.includes(option)) {
          classes.push("wrong");
        }
      }

      return classes.join(" ");
    }

    function toggleMultiAnswer(questionUid, option) {
      const current = state.selectedAnswers.get(questionUid) || [];
      const next = current.includes(option)
        ? current.filter((item) => item !== option)
        : [...current, option];
      state.selectedAnswers.set(questionUid, next);
      renderQuestion();
    }

    function submitAnswer(answer) {
      const question = state.questions[state.currentIndex];
      if (!question || state.results.has(question.uid)) {
        return;
      }

      const selected = answer.map(String);
      const correct = isFillExam()
        ? selected[0] === question.correctAnswers[0]
        : sameAnswerSet(selected, question.correctAnswers);
      const result = {
        selected,
        correct,
        correctAnswers: question.correctAnswers
      };

      state.selectedAnswers.set(question.uid, selected);
      state.results.set(question.uid, result);
      renderQuestion();

      if (correct && !isFillExam()) {
        state.autoTimer = window.setTimeout(() => {
          goNext();
        }, 700);
      }
    }

    function submitMultiAnswer() {
      const question = state.questions[state.currentIndex];
      const selected = state.selectedAnswers.get(question.uid) || [];
      if (selected.length === 0) {
        setFeedback("请选择答案后再提交。", "warn");
        return;
      }
      submitAnswer(selected);
    }

    function submitFillAnswer() {
      const value = dom.fillInput.value;
      if (value === "") {
        setFeedback("请输入答案后再提交。", "warn");
        return;
      }
      submitAnswer([value]);
    }

    function showStoredResult(result) {
      if (result.correct) {
        setFeedback("回答正确", "ok");
        return;
      }

      setFeedback(`回答错误。正确答案：${result.correctAnswers.join("、")}`, "error");
    }

    function setFeedback(text, type) {
      dom.feedback.textContent = text;
      dom.feedback.className = `feedback ${type}`;
    }

    function goPrev() {
      clearAutoTimer();
      if (state.currentIndex > 0) {
        state.currentIndex -= 1;
        renderQuestion();
      }
    }

    function goNext() {
      clearAutoTimer();
      if (state.currentIndex < state.questions.length - 1) {
        state.currentIndex += 1;
        renderQuestion();
      } else {
        finishExam();
      }
    }

    function finishExam() {
      clearAutoTimer();
      const correctCount = state.questions.reduce((total, question) => {
        const result = state.results.get(question.uid);
        return total + (result && result.correct ? 1 : 0);
      }, 0);
      const total = state.questions.length;

      dom.scoreText.textContent = `${correctCount} / ${total}`;
      dom.scoreSubText.textContent = `做对了 ${correctCount} 道，共 ${total} 道`;
      showView("result");
    }

    function restartExam() {
      if (state.currentBank) {
        startExam(state.currentBank);
      } else {
        loadBanks();
      }
    }

    function goHome() {
      clearAutoTimer();
      showView("home");
      renderBankList();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderFormattedText(target, value) {
      const source = String(value);
      const fragment = document.createDocumentFragment();
      const codeBlockPattern = /```[^\n]*\n?([\s\S]*?)```/g;
      let lastIndex = 0;
      let match;

      while ((match = codeBlockPattern.exec(source)) !== null) {
        appendTextBlock(fragment, source.slice(lastIndex, match.index));
        const pre = document.createElement("pre");
        const code = document.createElement("code");
        pre.className = "formatted-code";
        code.textContent = match[1].replace(/\n$/, "");
        pre.appendChild(code);
        fragment.appendChild(pre);
        lastIndex = codeBlockPattern.lastIndex;
      }

      appendTextBlock(fragment, source.slice(lastIndex));
      target.replaceChildren(fragment);
    }

    function appendTextBlock(fragment, text) {
      if (!text) {
        return;
      }

      const span = document.createElement("span");
      span.className = "formatted-text";
      span.textContent = text;
      fragment.appendChild(span);
    }

    function getBankDisplayName(fileName) {
      return String(fileName).replace(/\.txt$/i, "");
    }

    dom.reloadBtn.addEventListener("click", loadBanks);
    dom.homeBtn.addEventListener("click", goHome);
    dom.prevBtn.addEventListener("click", goPrev);
    dom.nextBtn.addEventListener("click", goNext);
    dom.submitMultiBtn.addEventListener("click", submitMultiAnswer);
    dom.submitFillBtn.addEventListener("click", submitFillAnswer);
    dom.fillInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        submitFillAnswer();
      }
    });
    dom.restartBtn.addEventListener("click", restartExam);
    dom.resultHomeBtn.addEventListener("click", goHome);

    loadBanks();
  </script>
</body>
</html>
